<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control horario</title>
  <meta name="description" content="Control horario semanal, banco de horas y vacaciones">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23234a3c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e9efe0' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 3' stroke='%23e9efe0' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=20261022b">
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div>
        <p class="sobretitulo" id="hoy-texto"></p>
        <h1 id="titulo">Tu semana, en orden.</h1>
        <p class="bajada" id="bajada">Cargá tus horarios. El resto, a la vista.</p>
      </div>
      <div class="cabecera-der">
        <button class="pastilla boton-menu" id="btn-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-lateral"><span aria-hidden="true">☰</span> <span id="vista-actual">Semana</span></button>
        <span class="pastilla">28 h semanales · 4 días</span>
        <span class="pastilla estado-sync" id="estado-sync" title="">Solo en este navegador</span>
      </div>
    </header>

    <div class="espacio"></div>
    <main id="vista"></main>

    <footer class="pie">
      <span id="pie-estado">Guardado en este navegador</span>
      <div class="pie-acciones">
        <button class="enlace" id="btn-exportar">Descargar copia</button>
        <button class="enlace" id="btn-importar">Recuperar copia</button>
        <input type="file" id="archivo-importar" accept="application/json,.json" hidden>
      </div>
    </footer>
  </div>
  <div class="velo" id="velo" hidden></div>
  <nav class="menu-lateral" id="menu-lateral" aria-label="Secciones" aria-hidden="true">
    <div class="menu-cab"><span class="rotulo">Menú</span><button class="enlace" id="btn-cerrar-menu" aria-label="Cerrar menú">✕</button></div>
    <div class="menu-info">
      <p class="sobretitulo" id="menu-hoy"></p>
      <p class="menu-titulo">Tu semana, en orden.</p>
      <p class="nota">28 h semanales · 4 días</p>
      <p class="nota" id="menu-sync"></p>
    </div>
    <button data-vista="semana" class="activa">Semana</button>
    <button data-vista="anual">Carga anual</button>
    <button data-vista="banco">Banco de horas</button>
    <button data-vista="vacaciones">Vacaciones</button>
    <button data-vista="config">Configuración</button>
  </nav>
  <div class="aviso-flotante" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=20261022b"></script>
</body>
</html>
